function clean(h){const d=new DOMParser().parseFromString(h||"","text/html");
(function w(n){[...n.childNodes].forEach(c=>{if(c.nodeType===3)return;if(c.nodeType!==1){c.remove();return}
if(c.tagName==="SCRIPT"||c.tagName==="STYLE"){c.remove();return}
if(c.tagName==="IMG"){const src=c.getAttribute("src")||"",alt=c.getAttribute("alt")||"",sty=c.getAttribute("style")||"";
if(!/^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+\/=]+$/.test(src)){c.remove();return}
[...c.attributes].forEach(a=>c.removeAttribute(a.name));c.setAttribute("src",src);if(alt)c.setAttribute("alt",alt.slice(0,200));
const mw=/width:\s*(\d{1,3})%/.exec(sty);if(mw)c.setAttribute("style","width:"+Math.min(100,+mw[1])+"%");return}
w(c);if(!OKT.has(c.tagName)){c.replaceWith(...c.childNodes);return}
const st=c.getAttribute("style");[...c.attributes].forEach(a=>c.removeAttribute(a.name));
if(st){const m=/text-align:\s*(left|center|right|justify)/.exec(st);if(m)c.setAttribute("style","text-align:"+m[1])}})})(d.body);return d.body.innerHTML}

const D={staff:[],citizens:[],fines:[],fine_comments:[],audits:[],tickets:[],ticket_messages:[],docs:[],events:[],audit_templates:[],planner:[],meetings:[],taxes:[],doc_templates:[]};

/* images : réduites et intégrées au document */
function readURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("Lecture impossible"));r.readAsDataURL(file)})}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("Image illisible"));i.src=src})}
async function shrink(file){
if(!/^image\/(png|jpe?g|gif|webp)$/.test(file.type))throw new Error("Format non pris en charge (PNG, JPG, GIF, WebP).");
const src=await readURL(file);if(file.type==="image/gif"&&file.size<900000)return src;
const i=await loadImg(src),k=Math.min(1,1400/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement("canvas");
c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);
const x=c.getContext("2d"),draw=bg=>{x.clearRect(0,0,c.width,c.height);if(bg){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(i,0,0,c.width,c.height)};
let out;if(file.type==="image/png"){draw(false);out=c.toDataURL("image/png");if(out.length>700000){draw(true);out=c.toDataURL("image/jpeg",.8)}}else{draw(true);out=c.toDataURL("image/jpeg",.82)}
if(out.length>1800000)throw new Error("Image trop lourde, même réduite.");return out}

const L=D.planner.filter(p=>p.owner===me).sort((a,b)=>(a.done-b.done)||((a.day||"9999").localeCompare(b.day||"9999"))||String(a.created_at).localeCompare(String(b.created_at)));
return `<section class="plan"><h2>Mon planificateur <small class="mu">· visible par toi seul</small></h2>
<div class="notes"><form class="pn new" data-f="plan" style="--c:var(--ac)"><b>+ Nouveau post-it</b><textarea name="title" placeholder="Une tâche, un rappel…" required maxlength="140" rows="4"></textarea><div class="pr"><input type="date" name="day"><button class="btn s">Coller</button></div></form>
${L.map(p=>{const h=pcol(p.id),late=!p.done&&p.day&&p.day<t0;return `<article class="pn ${p.done?"dn":""}" style="--c:${PNC[h%PNC.length]};--r:${((h>>3)%5-2)*.7}deg"><button class="x" data-a="del" data-t="planner" data-id="${esc(p.id)}" aria-label="Supprimer">×</button><textarea class="pt" data-meta="planner:${esc(p.id)}:title" maxlength="140" rows="4" aria-label="Modifier">${esc(p.title)}</textarea><div class="pr"><input type="date" class="pd ${late?"late":""}" data-meta="planner:${esc(p.id)}:day" value="${p.day||""}" aria-label="Date"><button class="chk" data-a="ptog" data-id="${esc(p.id)}" aria-label="Terminé">${p.done?"✓":""}</button></div></article>`}).join("")}</div></section>`};

/* éditeur de documents (partagé : contrôles + documents) */
function editorUI(table,rec,backTo,meta,tk="title",dl="Supprimer"){
return `<div class="row"><button class="btn g s" data-go="${backTo}">${ICO.chL} Retour</button><span style="flex:1"></span><span id="sv" class="mu">Enregistré</span><button class="btn g s" data-a="print">${ICO.print} Imprimer</button>${del(table,rec.id,backTo,dl)}</div>
<div class="card"><input id="dt" class="dtitle" data-meta="${table}:${rec.id}:${tk}" value="${esc(rec[tk])}" placeholder="Titre du document"><div class="meta">${meta}</div></div>
<div class="tools" id="tb"><button class="tl" data-cmd="undo" title="Annuler">${ICO.undo}</button><button class="tl" data-cmd="redo" title="Rétablir">${ICO.redo}</button><span class="sep"></span>
<select id="blk" title="Style"><option value="p">Texte</option><option value="h1">Titre 1</option><option value="h2">Titre 2</option><option value="h3">Titre 3</option><option value="blockquote">Citation</option></select><span class="sep"></span>
<button class="tl" data-cmd="bold" title="Gras"><b>G</b></button><button class="tl" data-cmd="italic" title="Italique"><i>I</i></button><button class="tl" data-cmd="underline" title="Souligné"><u>S</u></button><button class="tl" data-cmd="strikeThrough" title="Barré"><s>B</s></button><span class="sep"></span>
<button class="tl" data-cmd="insertUnorderedList" title="Liste à puces">Puces</button><button class="tl" data-cmd="insertOrderedList" title="Liste numérotée">Numéros</button><span class="sep"></span>
<button class="tl" data-cmd="justifyLeft" title="Aligner à gauche">${ICO.aL}</button><button class="tl" data-cmd="justifyCenter" title="Centrer">${ICO.aC}</button><button class="tl" data-cmd="justifyRight" title="Aligner à droite">${ICO.aR}</button><span class="sep"></span>
<button class="tl" data-cmd="insertHorizontalRule" title="Séparateur">${ICO.hr}</button><button class="tl" data-cmd="removeFormat" title="Effacer la mise en forme">Tx</button><span class="sep"></span><button class="tl" data-img="add" title="Insérer une image (ou glisse / colle une image dans le texte)">${ICO.image} Image</button><select id="isz" disabled title="Clique sur une image pour changer sa taille"><option value="">Taille image</option><option value="25%">25 %</option><option value="50%">50 %</option><option value="75%">75 %</option><option value="100%">100 %</option></select><input type="file" id="fi" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden></div>
<div class="paperbg"><div class="paper"><div id="ed" class="ed" contenteditable="true">${clean(rec.html)}</div></div></div>
<div class="foot mu"><span id="wc"></span><span>Dernière modification : ${rec.updated_by?esc(rec.updated_by)+" · ":""}${fmt(rec.updated_at||rec.created_at)}</span></div>`}
function bindEditor(table,id){const ed=$("#ed");if(!ed)return;const rec=()=>D[table].find(x=>x.id===id);
let last=clean(rec().html),dirty=false,timer=null;
const wc=()=>{const t=(ed.textContent||"").trim();$("#wc").textContent=(t?t.split(/\s+/).length:0)+" mots"};
const save=async()=>{if(!dirty)return;dirty=false;const h=clean(ed.innerHTML);last=h;const sv=$("#sv");if(sv)sv.textContent="Enregistrement…";
const r=await sb.from(table).update({html:h,updated_by:name(),updated_at:new Date().toISOString()}).eq("id",id);
const s2=$("#sv");if(s2)s2.textContent=r.error?"Erreur : "+r.error.message:"Enregistré à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})};
ED={table,id,flush:()=>{clearTimeout(timer);save()},sync:()=>{if(dirty)return;const r=rec();if(!r)return;const h=clean(r.html);if(h!==last){ed.innerHTML=h;last=h;wc();if(ED)ED.img=null}}};
const chg=()=>{dirty=true;wc();const sv=$("#sv");if(sv)sv.textContent="Modifications non enregistrées…";clearTimeout(timer);timer=setTimeout(save,700)};
ed.oninput=chg;wc();
const fi=$("#fi"),isz=$("#isz");let saved=null;
const keepSel=()=>{const g=getSelection();if(g&&g.rangeCount&&ed.contains(g.anchorNode))saved=g.getRangeAt(0).cloneRange()};
ed.addEventListener("keyup",keepSel);ed.addEventListener("mouseup",keepSel);
async function addImgs(files){for(const file of files){try{const url=await shrink(file);ed.focus();if(saved){const g=getSelection();g.removeAllRanges();g.addRange(saved)}document.execCommand("insertImage",false,url);keepSel()}catch(err){alert(err.message||"Impossible d’insérer l’image")}}chg()}
fi.onchange=()=>{addImgs([...fi.files]);fi.value=""};
ed.ondragover=e=>{if([...(e.dataTransfer&&e.dataTransfer.types||[])].includes("Files"))e.preventDefault()};
ed.ondrop=e=>{const imgs=[...(e.dataTransfer.files||[])].filter(x=>x.type.startsWith("image/"));if(!imgs.length)return;e.preventDefault();const r=document.caretRangeFromPoint&&document.caretRangeFromPoint(e.clientX,e.clientY);if(r)saved=r;addImgs(imgs)};
ed.onclick=e=>{ed.querySelectorAll("img.sel").forEach(i=>i.classList.remove("sel"));if(e.target.tagName==="IMG"){e.target.classList.add("sel");ED.img=e.target;isz.disabled=false;isz.value=e.target.style.width||""}else{ED.img=null;isz.disabled=true;isz.value=""}};
isz.onchange=()=>{if(ED.img&&isz.value){ED.img.style.width=isz.value;chg()}};
ed.onpaste=e=>{const cd=e.clipboardData||window.clipboardData;const imgs=[...(cd.files||[])].filter(x=>x.type.startsWith("image/"));e.preventDefault();if(imgs.length){keepSel();addImgs(imgs);return}document.execCommand("insertText",false,cd.getData("text/plain"))};
ed.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();ED.flush()}};
$("#tb").onmousedown=e=>{if(e.target.closest("button"))e.preventDefault()};
$("#tb").onclick=e=>{if(e.target.closest("[data-img]")){keepSel();fi.click();return}const b=e.target.closest("[data-cmd]");if(!b)return;ed.focus();document.execCommand(b.dataset.cmd);chg()};
$("#blk").onchange=e=>{ed.focus();document.execCommand("formatBlock",false,"<"+e.target.value+">");e.target.value="p";chg()}}

else{const key=v==="co"?(r=>r.co):(r=>String(r.t.period||"—"));const G={};L.forEach(r=>{(G[key(r)]=G[key(r)]||[]).push(r)});

V.calendar=()=>{const now=new Date(),tk=iso(now),month=cal.view==="month";let title,cells=[];

V.account=()=>`<div class="card" style="max-width:460px"><h2>Mon compte</h2><p class="mu">Connecté en tant que <b>${esc(myLogin())}</b> · ${esc(RL(mine.role))}</p><form data-f="pwchange" class="stack"><label>Nouveau mot de passe<input name="pw" type="password" minlength="6" required autocomplete="new-password"></label><label>Confirmer<input name="pw2" type="password" minlength="6" required autocomplete="new-password"></label><button class="btn">Changer mon mot de passe</button></form></div>`;

/* ---------- données ---------- */
async function load(t){const {data}=await sb.from(t).select("*");D[t]=data||[];render()}
const loadAll=()=>Promise.all(Object.keys(D).map(t=>load(t)));
async function ins(t,row){const r=await sb.from(t).insert(row).select().single();if(!r.error&&r.data&&!D[t].some(x=>x.id===r.data.id))D[t].push(r.data);return r}
async function upd(t,id,p,key="id"){const r=await sb.from(t).update(p).eq(key,id);if(r.error)alert(r.error.message);else await load(t);return r}
const fail=r=>{if(r&&r.error){alert(r.error.message);return true}return false};

/* ---------- événements ---------- */
document.addEventListener("click",async e=>{const b=e.target.closest("[data-go],[data-a]");if(!b)return;
if(b.dataset.go!==undefined){const[t,id]=b.dataset.go.split(":");go(t,id);return}
const a=b.dataset.a,id=b.dataset.id;
if(a==="flt"){flt[b.dataset.k]=b.dataset.v;render(true)}
else if(a==="tplmk"){const ty=b.dataset.ty;const r=await ins("audit_templates",{type:ty,html:tplFor(ty),updated_by:name()});if(!fail(r))go("ctpl",r.data.id)}
else if(a==="cnav"){const d=+b.dataset.d;if(cal.view==="month"){if(!d){const n=new Date();cal.y=n.getFullYear();cal.m=n.getMonth()}else{const x=new Date(cal.y,cal.m+d,1);cal.y=x.getFullYear();cal.m=x.getMonth()}}else{cal.wk=d?cal.wk+d:0}render(true)}
else if(a==="cview"){cal.view=b.dataset.v;render(true)}
else if(a==="evsel"){cal.sel=id||null;render(true)}
else if(a==="evnew"){cal.sel="new:"+b.dataset.d;render(true)}
else if(a==="set"){const r=await upd(b.dataset.t,id,{[b.dataset.k]:b.dataset.v});if(!r.error)toast("Mis à jour")}
else if(a==="ptog"){const p=D.planner.find(x=>x.id===id);if(p)await upd("planner",id,{done:!p.done})}
else if(a==="taxpaid"){const t=D.taxes.find(x=>x.id===id);if(t){const r=await upd("taxes",id,{paid:taxDue(t)});if(!r.error)toast("Marqué comme payé")}}
else if(a==="tsort"){const k=b.dataset.k;if(flt.ts===k)flt.td=flt.td==="asc"?"desc":"asc";else{flt.ts=k;flt.td="asc"}render(true)}
else if(a==="tclear"){["te","tf","tt","tx","tw"].forEach(k=>delete flt[k]);q="";render(true)}
else if(a==="twk"){const d=b.dataset.d;if(d==="all")flt.tw="all";else if(d==="0")delete flt.tw;else{const cw=selWk()==="all"?curWk():selWk(),mo=wkMon(cw);if(mo){mo.setDate(mo.getDate()+7*Number(d));flt.tw=wkOf(mo)}}render(true)}
else if(a==="tnew"){const tw0=selWk()==="all"?curWk():selWk();const r=await ins("taxes",{citizen_id:id,period:tw0,revenue:0,rate:lastRate(id),paid:0,created_by:name()});if(!fail(r))go("taxes",r.data.id)}
else if(a==="taxco"){flt.te=id;flt.tw="all";flt.tv="table";go("taxes")}
else if(a==="tcsv"){taxCSV(taxFiltered())}
else if(a==="savetpl"){if(ED)ED.flush();const t=b.dataset.t,rec=D[t].find(x=>x.id===id);if(rec){const r=await ins("doc_templates",{scope:t==="meetings"?"meetings":"docs",name:(rec.title||"Sans titre")+" (modèle)",html:rec.html,updated_by:name()});if(!fail(r))toast("Modèle enregistré")}}
else if(a==="logout"){sb.auth.signOut()}
else if(a==="tset"){await upd("tickets",id,{status:b.dataset.v,last_source:"site"})}
else if(a==="mkcit"){const t=D.tickets.find(x=>x.id===id);const r=await ins("citizens",{name:t.opener_name,discord_id:t.opener_id,source:"discord"});if(!fail(r))render(true)}
else if(a==="print"){window.print()}
else if(a==="del"){if(!b.dataset.ar){b.dataset.ar=1;b.dataset.l=b.textContent;b.textContent="Confirmer ?";b.classList.add("d");setTimeout(()=>{if(b.isConnected){b.dataset.ar="";b.textContent=b.dataset.l;b.classList.remove("d")}},3000);return}
const t=b.dataset.t;if(ED&&ED.id===id)ED=null;
const r=await sb.from(t).delete().eq(b.dataset.key||"id",id);if(fail(r))return;
await loadAll();if(b.dataset.back)go(b.dataset.back);toast("Supprimé")}});
document.addEventListener("change",async e=>{
const nt=e.target.closest("[data-newtax]");if(nt){const v0=Number(nt.value);if(nt.value!==""&&v0>=0){const tw0=selWk()==="all"?curWk():selWk();const r=await ins("taxes",{citizen_id:nt.dataset.newtax,period:tw0,revenue:v0,rate:lastRate(nt.dataset.newtax),paid:0,created_by:name()});if(!fail(r)){toast("Déclaration enregistrée");render(true)}}return}
const fk=e.target.closest("[data-fk]");if(fk){flt[fk.dataset.fk]=fk.value;render(true);return}
const el=e.target.closest("[data-meta]");if(el){const[t,id,k]=el.dataset.meta.split(":");let v=el.value;if(k==="day"&&!v)v=null;if(t==="taxes"&&k==="paid")v=Math.max(0,Number(v||0));if(t==="citizens"&&k==="name"&&!v.trim()){render(true);return}if(t==="planner"){if(k==="title"&&!v.trim()){render(true);return}}await upd(t,id,{[k]:v});return}
const rs=e.target.closest("[data-role]");if(rs){const r=await upd("staff",rs.dataset.role,{role:rs.value},"login");if(!r.error)toast("Rôle modifié")}});
document.addEventListener("input",e=>{if(!e.target.matches("[data-q]"))return;q=e.target.value;const p=e.target.selectionStart;render(true);const n=$("#q");if(n){n.focus();n.setSelectionRange(p,p)}});
document.addEventListener("focusout",e=>{if(pending&&!$("#v").contains(e.relatedTarget))setTimeout(()=>render(),40)});
document.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest(".tile");if(!t)return;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.setProperty("--ry",(x*16)+"deg");t.style.setProperty("--rx",(-y*16)+"deg")});
document.addEventListener("pointerout",e=>{const t=e.target.closest&&e.target.closest(".tile");if(t){t.style.removeProperty("--rx");t.style.removeProperty("--ry")}});
$("#out").onclick=()=>sb.auth.signOut();
document.addEventListener("submit",async e=>{e.preventDefault();const fm=e.target,k=fm.dataset.f,id=fm.dataset.id,d=Object.fromEntries(new FormData(fm));let r;
if(k==="reply"){r=await ins("ticket_messages",{ticket_id:R.id,author:name(),content:d.content,source:"site"});if(!fail(r)){fm.reset();render(true)}}
else if(k==="citsave"){r=await upd("citizens",id,d);if(!r.error)toast("Dossier enregistré")}
else if(k==="citizens"){r=await ins("citizens",{name:d.name.trim(),boss:d.boss||null,boss_phone:d.boss_phone||null,coboss:d.coboss||null,coboss_phone:d.coboss_phone||null,phone:d.phone||null,kind:"Entreprise",source:"site"});if(!fail(r)){toast("Entreprise ajoutée");render(true);const n=document.querySelector(".rowco.add input[name=name]");if(n)n.focus()}}
else if(k==="fines"){r=await ins("fines",{...d,amount:Number(d.amount),created_by:name(),source:"site"});if(!fail(r)){toast("Amende émise");go("fines",r.data.id)}}
else if(k==="finsave"){r=await upd("fines",id,{...d,amount:Number(d.amount)});if(!r.error)toast("Amende enregistrée")}
else if(k==="fcomment"){r=await ins("fine_comments",{fine_id:id,author:name(),content:d.content});if(!fail(r)){fm.reset();render(true)}}
else if(k==="audits"){if(d.company!==undefined){const nm=d.company.trim().toLowerCase();let c=D.citizens.find(x=>isCo(x)&&x.name.trim().toLowerCase()===nm);if(!c){const rc=await ins("citizens",{name:d.company.trim(),kind:"Entreprise",source:"site"});if(fail(rc))return;c=rc.data}d.citizen_id=c.id}
r=await ins("audits",{citizen_id:d.citizen_id,type:d.type,title:(d.title||"").trim()||`${d.type} – ${cn(d.citizen_id)}`,html:fillTpl(tplFor(d.type),{citoyen:cn(d.citizen_id),type:d.type,date:today(),agent:name()}),created_by:name(),updated_by:name(),source:"site"});if(!fail(r))go("audits",r.data.id)}
else if(k==="docs"){r=await ins("docs",{title:d.title,category:d.category,html:docHtml(d.tpl,d.title),status:"Brouillon",created_by:name(),updated_by:name()});if(!fail(r))go("docs",r.data.id)}
else if(k==="tpladd"){r=await ins("audit_templates",{type:d.type.trim(),html:DEFTPL.generic,updated_by:name()});if(!fail(r)){toast("Type créé");go("ctpl",r.data.id)}}
else if(k==="plan"){r=await ins("planner",{owner:myLogin(),title:d.title.trim(),day:d.day||null,done:false});if(!fail(r)){fm.reset();render(true)}}
else if(k==="meetings"){if(!canTeam())return;r=await ins("meetings",{title:d.title,day:d.day||null,attendees:d.attendees||null,html:d.tpl&&d.tpl!=="std"?docHtml(d.tpl,d.title):TPL.meeting(),created_by:name(),updated_by:name()});if(!fail(r))go("meetings",r.data.id)}
else if(k==="taxes"){const nm=d.company.trim().toLowerCase();let c=D.citizens.find(x=>isCo(x)&&x.name.trim().toLowerCase()===nm);if(!c){const rc=await ins("citizens",{name:d.company.trim(),kind:"Entreprise",source:"site"});if(fail(rc))return;c=rc.data}
r=await ins("taxes",{citizen_id:c.id,period:d.period,revenue:Number(d.revenue),rate:Number(d.rate),due_date:d.due_date||null,paid:0,created_by:name()});if(!fail(r)){toast("Déclaration enregistrée");go("taxes",r.data.id)}}
else if(k==="taxsave"){r=await upd("taxes",id,{period:d.period,due_date:d.due_date||null,revenue:Number(d.revenue),rate:Number(d.rate),paid:Number(d.paid||0),notes:d.notes});if(!r.error)toast("Déclaration enregistrée")}
else if(k==="dtplnew"){if(d.scope==="meetings"&&!canTeam())return;r=await ins("doc_templates",{scope:d.scope,name:d.name.trim(),html:d.scope==="meetings"?TPL.meeting():"<h1>{{titre}}</h1><p>Rédigé par {{agent}} le {{date}}</p><p><br></p>",updated_by:name()});if(!fail(r)){toast("Modèle créé");go("dtpl",r.data.id)}}
else if(k==="pwchange"){if(d.pw!==d.pw2)return alert("Les deux mots de passe ne correspondent pas.");const rp=await sb.auth.updateUser({password:d.pw});if(rp.error)alert(rp.error.message);else{fm.reset();toast("Mot de passe modifié")}}
else if(k==="evsave"){const row={title:d.title,kind:d.kind,day:d.day,start_time:d.start_time||null,end_time:d.end_time||null,citizen_id:d.citizen_id||null,assignee:d.assignee||null,notes:d.notes||null};
if(id){r=await upd("events",id,row);if(!r.error)toast("Événement enregistré")}
else{r=await ins("events",{...row,created_by:name()});if(!fail(r)){const x=new Date(row.day+"T12:00");cal.y=x.getFullYear();cal.m=x.getMonth();cal.sel=r.data.id;toast("Événement ajouté");render(true)}}}
else if(k==="staff"){if(!isDir()&&d.role!=="agent")return alert("Seul le directeur peut nommer un co-directeur ou un directeur.");
const lg=d.login.trim().toLowerCase().replace(/[^a-z0-9._-]/g,"");if(!lg)return alert("Identifiant invalide (lettres, chiffres, point, tiret).");if(String(d.pw).length<6)return alert("Mot de passe : 6 caractères minimum.");
if(D.staff.some(x=>x.login===lg))return alert("Cet identifiant existe déjà dans l’équipe.");
const tmp=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
let su=await tmp.auth.signUp({email:EMAIL(lg),password:d.pw});
if(su.error){const si=await tmp.auth.signInWithPassword({email:EMAIL(lg),password:d.pw});if(si.error)return alert("Impossible de créer ce compte : "+su.error.message+" (si l’identifiant a déjà servi, choisis-en un autre).")}
r=await sb.from("staff").insert({login:lg,name:d.name,role:d.role});if(!fail(r)){fm.reset();toast("Compte créé");await load("staff")}}});

/* ---------- démarrage ---------- */
async function boot(){
const {data:{session}}=await sb.auth.getSession();user=session?.user||null;$("#out").hidden=!user;$("#acc").hidden=!user;
if(!user)return render();
$("#who").textContent=name();$("#av").textContent=name()[0].toUpperCase();
const {data}=await sb.from("staff").select("*");D.staff=data||[];
mine=D.staff.find(s=>s.login===myLogin())||null;
$("#who").textContent=name();$("#av").textContent=name()[0].toUpperCase();
if(mine)$("#rl").textContent=RL(mine.role);
render();if(!mine)return;
await loadAll();
sb.channel("site").on("postgres_changes",{event:"*",schema:"public"},p=>{if(D[p.table])load(p.table)}).subscribe();
}
let started=false;
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")location.reload();if(ev==="SIGNED_IN"&&!started){started=true;boot()}});
setTimeout(()=>{if(!started){started=true;boot()}},800);
</script></body></html>
