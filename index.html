[data-t=bleu]{--bg:linear-gradient(135deg,#dbe2ea 0%,#eef1f5 35%,#d4dce6 65%,#ecf0f4 100%);--card:linear-gradient(180deg,#fdfeff 0%,#f1f4f8 100%);--tx:#131c28;--mu:#586677;--ac:#1f4f8f;--ac2:#e0e7f0;--bd:#c5cfdc;--bt:linear-gradient(180deg,#2e66ad 0%,#1f4f8f 55%,#183f73 100%);--sb:linear-gradient(180deg,#1c3556 0%,#0f2038 55%,#162c49 100%);--sh:0 1px 2px #0f1a2814}
[data-t=orange]{--bg:linear-gradient(135deg,#e6dfd8 0%,#f4f0ec 35%,#e0d7cd 65%,#f1ede8 100%);--card:linear-gradient(180deg,#fffefd 0%,#f6f2ee 100%);--tx:#27190e;--mu:#6e5c4c;--ac:#a2561a;--ac2:#efe5db;--bd:#d6c9bc;--bt:linear-gradient(180deg,#bb6b2b 0%,#a2561a 55%,#874614 100%);--sb:linear-gradient(180deg,#42291a 0%,#2a1a10 55%,#38231a 100%);--sh:0 1px 2px #2a190e14}
[data-t=clair]{--bg:linear-gradient(135deg,#dfe1e4 0%,#f3f4f5 35%,#d8dbdf 65%,#f0f1f3 100%);--card:linear-gradient(180deg,#ffffff 0%,#f4f5f6 100%);--tx:#1b1f24;--mu:#5f666e;--ac:#3a4552;--ac2:#e5e7ea;--bd:#ccd0d5;--bt:linear-gradient(180deg,#566272 0%,#3a4552 55%,#2c3642 100%);--sb:linear-gradient(180deg,#58616b 0%,#363d45 55%,#4a535c 100%);--sh:0 1px 2px #1b1f2412}
[data-t=sombre]{--bg:linear-gradient(135deg,#0b0e11 0%,#161b20 40%,#0d1114 70%,#171c21 100%);--card:linear-gradient(180deg,#1c2229 0%,#151a1f 100%);--tx:#e4e9ed;--mu:#919ea8;--ac:#46b3a0;--ac2:#222b32;--bd:#2d373f;--rd:#ee7366;--bt:linear-gradient(180deg,#3ca594 0%,#2a8272 55%,#1f6a5c 100%);--sb:linear-gradient(180deg,#171c21 0%,#0a0d10 55%,#12171b 100%);--inp:#0f1317;--hi:#ffffff14;--sh:0 1px 2px #00000066}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-attachment:fixed;color:var(--tx);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100vh}
aside.sbar{width:236px;flex:none;background:repeating-linear-gradient(90deg,#ffffff08 0 1px,transparent 1px 3px),var(--sb);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid #00000040}
.brand{display:flex;gap:12px;align-items:center;padding:22px 20px 20px;border-bottom:1px solid #ffffff1f}.brand b{display:block;font-size:15px;letter-spacing:.16em;font-weight:700}.brand small{opacity:.65;font-size:11px;letter-spacing:.04em}
.logo{width:36px;height:36px;border:1px solid #ffffff4d;border-radius:6px;display:grid;place-items:center;background:linear-gradient(180deg,#ffffff1f,#ffffff08)}.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.logo.big{width:52px;height:52px;margin:0 auto 16px;background:var(--bt);border-color:transparent}.logo.big svg{width:28px;height:28px}
nav{display:flex;flex-direction:column;padding:14px 0;gap:1px}
nav button{display:flex;align-items:center;gap:12px;border:0;border-left:3px solid transparent;background:none;color:#ffffffb8;padding:10px 20px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:500;text-align:left}
nav button:hover{background:#ffffff10;color:#fff}nav button.on{background:linear-gradient(90deg,#ffffff24,#ffffff0a);border-left-color:#fff;color:#fff;font-weight:600}
nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav .bd{margin-left:auto;background:#fff;color:#1b2127;border-radius:3px;padding:0 6px;font-size:11px;font-weight:700;line-height:18px}
.sfoot{margin-top:auto;padding:16px 20px;border-top:1px solid #ffffff1f}.sfoot small{display:block;opacity:.6;margin-bottom:10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:20px;height:20px;border-radius:4px;border:1px solid #ffffff55;cursor:pointer;padding:0}.sw button.on{outline:2px solid #fff;outline-offset:2px}
.main{flex:1;min-width:0}

function clean(h){const d=new DOMParser().parseFromString(h||"","text/html");
(function w(n){[...n.childNodes].forEach(c=>{if(c.nodeType===3)return;if(c.nodeType!==1){c.remove();return}

if(!/^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+\/=]+$/.test(src)){c.remove();return}

const mw=/width:\s*(\d{1,3})%/.exec(sty);if(mw)c.setAttribute("style","width:"+Math.min(100,+mw[1])+"%");return}
w(c);if(!OKT.has(c.tagName)){c.replaceWith(...c.childNodes);return}
const st=c.getAttribute("style");[...c.attributes].forEach(a=>c.removeAttribute(a.name));
if(st){const m=/text-align:\s*(left|center|right|justify)/.exec(st);if(m)c.setAttribute("style","text-align:"+m[1])}})})(d.body);return d.body.innerHTML}

function readURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("Lecture impossible"));r.readAsDataURL(file)})}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("Image illisible"));i.src=src})}
async function shrink(file){
if(!/^image\/(png|jpe?g|gif|webp)$/.test(file.type))throw new Error("Format non pris en charge (PNG, JPG, GIF, WebP).");
const src=await readURL(file);if(file.type==="image/gif"&&file.size<900000)return src;
const i=await loadImg(src),k=Math.min(1,1400/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement("canvas");
c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);
const x=c.getContext("2d"),draw=bg=>{x.clearRect(0,0,c.width,c.height);if(bg){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(i,0,0,c.width,c.height)};
let out;if(file.type==="image/png"){draw(false);out=c.toDataURL("image/png");if(out.length>700000){draw(true);out=c.toDataURL("image/jpeg",.8)}}else{draw(true);out=c.toDataURL("image/jpeg",.82)}
if(out.length>1800000)throw new Error("Image trop lourde, même réduite.");return out}

<div class="tiles">${TABS.filter(t=>t[0]!=="home"&&((t[0]!=="team"||canTeam())&&(t[0]!=="acct"||isDir()))).map(t=>`<button class="tile" data-go="${t[0]}">${IC[t[0]]}<span>${t[1]}</span></button>`).join("")}</div>${planner()}</div><aside class="dcol">${dispatch()}</aside></div>`};
const PNC=["#22f59b","#2a8bff","#ff3b5c","#ffc53d","#b66dff","#19d3da"];
const pcol=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return h};
const planner=()=>{const me=myLogin(),t0=iso(new Date());
const L=D.planner.filter(p=>p.owner===me).sort((a,b)=>(a.done-b.done)||((a.day||"9999").localeCompare(b.day||"9999"))||String(a.created_at).localeCompare(String(b.created_at)));
return `<section class="plan"><h2>Mon planificateur <small class="mu">· visible par toi seul</small></h2>
<div class="notes"><form class="pn new" data-f="plan" style="--c:var(--ac)"><b>+ Nouveau post-it</b><textarea name="title" placeholder="Une tâche, un rappel…" required maxlength="140" rows="4"></textarea><div class="pr"><input type="date" name="day"><button class="btn s">Coller</button></div></form>
${L.map(p=>{const h=pcol(p.id),late=!p.done&&p.day&&p.day<t0;return `<article class="pn ${p.done?"dn":""}" style="--c:${PNC[h%PNC.length]};--r:${((h>>3)%5-2)*.7}deg"><button class="x" data-a="del" data-t="planner" data-id="${esc(p.id)}" aria-label="Supprimer">×</button><textarea class="pt" data-meta="planner:${esc(p.id)}:title" maxlength="140" rows="4" aria-label="Modifier">${esc(p.title)}</textarea><div class="pr"><input type="date" class="pd ${late?"late":""}" data-meta="planner:${esc(p.id)}:day" value="${p.day||""}" aria-label="Date"><button class="chk" data-a="ptog" data-id="${esc(p.id)}" aria-label="Terminé">${p.done?"✓":""}</button></div></article>`}).join("")}</div></section>`};

/* tickets */
function threadHTML(id){const L=D.ticket_messages.filter(x=>x.ticket_id===id).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
return L.length?L.map(x=>`<div class="msg ${x.source}"><small><b>${esc(x.author)}</b> · ${x.source==="site"?"portail IRS":"Discord"} · ${fmt(x.created_at)}</small><p>${esc(x.content)}</p></div>`).join(""):`<div class="empty">Aucun message.</div>`}
function citPanel(t,c){
if(!c)return `<h2>Fiche entreprise</h2><div class="empty">Aucun dossier pour <b style="display:inline">${esc(t.opener_name)}</b>.</div><button class="btn" data-a="mkcit" data-id="${t.id}" style="width:100%">Créer le dossier</button>`;
const fs=D.fines.filter(x=>x.citizen_id===c.id).sort(desc),as=D.audits.filter(x=>x.citizen_id===c.id).sort(desc),due=fs.filter(x=>x.status==="Impayée").reduce((s,x)=>s+Number(x.amount),0);
return `<div class="row"><div class="av big">${esc((c.name||"?")[0].toUpperCase())}</div><div style="flex:1;min-width:0"><h2 style="margin:0">${esc(c.name)}</h2><span class="mu">${esc(c.job)}</span></div><button class="btn g s" data-go="citizens:${c.id}">Ouvrir le dossier</button></div>
<div class="mini"><div><b>${money(due)}</b><small>dû</small></div><div><b>${fs.length}</b><small>amendes</small></div><div><b>${as.length}</b><small>contrôles</small></div></div>
<form class="stack" data-f="citsave" data-id="${c.id}">${f("name","Nom de l’entreprise","text",true,c.name)}<div class="g2">${f("phone","Téléphone","text",false,c.phone)}${f("job","Activité","text",false,c.job)}</div>${ta("notes","Notes",c.notes,3)}<button class="btn">Enregistrer</button></form>
<h3>Amendes</h3>${fs.length?fs.slice(0,4).map(x=>`<div class="li" data-go="fines:${x.id}"><span class="f1">${esc(x.reason)}</span><b>${money(x.amount)}</b>${tag(x.status)}</div>`).join(""):'<span class="mu">Aucune.</span>'}
<h3>Contrôles</h3>${as.length?as.slice(0,4).map(x=>`<div class="li" data-go="audits:${x.id}"><span class="f1">${esc(x.title)}</span>${tag(x.status)}</div>`).join(""):'<span class="mu">Aucun.</span>'}`}
function ticketDetail(id){const t=D.tickets.find(x=>x.id===id);if(!t){R.id=null;return V.tickets()}
return `${back("tickets","Tickets")}<div class="split"><section class="card tk"><div class="tkh"><div style="flex:1;min-width:0"><h2>${esc(t.subject||"Ticket")}</h2><span class="mu">Ouvert par ${esc(t.opener_name)} · ${fmt(t.created_at)}</span></div>${tag(t.status)}${t.status==="open"?`<button class="btn d s" data-a="tset" data-id="${t.id}" data-v="closed">Clôturer</button>`:`<button class="btn g s" data-a="tset" data-id="${t.id}" data-v="open">Rouvrir</button>`}</div>
<div class="thread" id="thread">${threadHTML(id)}</div>
${t.status==="open"?`<form data-f="reply"><label>Répondre (envoyé dans le salon Discord)<textarea name="content" rows="2" required></textarea></label><button class="btn">Envoyer</button></form>`:""}</section>
<aside class="card side">${citPanel(t,citOf(t))}</aside></div>`}
V.tickets=()=>{if(R.id)return ticketDetail(R.id);const c=flt.tk||"open";

return `<div class="bar">${chips("tk",[["open",`Ouverts (${D.tickets.filter(t=>t.status==="open").length})`],["closed","Fermés"],["all","Tous"]],c)}${sbox("Rechercher un ticket…")}</div>

<div class="paperbg"><div class="paper"><div id="ed" class="ed" contenteditable="true">${clean(rec.html)}</div></div></div>

function bindEditor(table,id){const ed=$("#ed");if(!ed)return;const rec=()=>D[table].find(x=>x.id===id);
let last=clean(rec().html),dirty=false,timer=null;
const wc=()=>{const t=(ed.textContent||"").trim();$("#wc").textContent=(t?t.split(/\s+/).length:0)+" mots"};
const save=async()=>{if(!dirty)return;dirty=false;const h=clean(ed.innerHTML);last=h;const sv=$("#sv");if(sv)sv.textContent="Enregistrement…";
const r=await sb.from(table).update({html:h,updated_by:name(),updated_at:new Date().toISOString()}).eq("id",id);
const s2=$("#sv");if(s2)s2.textContent=r.error?"Erreur : "+r.error.message:"Enregistré à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})};
ED={table,id,flush:()=>{clearTimeout(timer);save()},sync:()=>{if(dirty)return;const r=rec();if(!r)return;const h=clean(r.html);if(h!==last){ed.innerHTML=h;last=h;wc();if(ED)ED.img=null}}};
const chg=()=>{dirty=true;wc();const sv=$("#sv");if(sv)sv.textContent="Modifications non enregistrées…";clearTimeout(timer);timer=setTimeout(save,700)};
ed.oninput=chg;wc();
const fi=$("#fi"),isz=$("#isz");let saved=null;
const keepSel=()=>{const g=getSelection();if(g&&g.rangeCount&&ed.contains(g.anchorNode))saved=g.getRangeAt(0).cloneRange()};
ed.addEventListener("keyup",keepSel);ed.addEventListener("mouseup",keepSel);
async function addImgs(files){for(const file of files){try{const url=await shrink(file);ed.focus();if(saved){const g=getSelection();g.removeAllRanges();g.addRange(saved)}document.execCommand("insertImage",false,url);keepSel()}catch(err){alert(err.message||"Impossible d’insérer l’image")}}chg()}
fi.onchange=()=>{addImgs([...fi.files]);fi.value=""};
ed.ondragover=e=>{if([...(e.dataTransfer&&e.dataTransfer.types||[])].includes("Files"))e.preventDefault()};
ed.ondrop=e=>{const imgs=[...(e.dataTransfer.files||[])].filter(x=>x.type.startsWith("image/"));if(!imgs.length)return;e.preventDefault();const r=document.caretRangeFromPoint&&document.caretRangeFromPoint(e.clientX,e.clientY);if(r)saved=r;addImgs(imgs)};
ed.onclick=e=>{ed.querySelectorAll("img.sel").forEach(i=>i.classList.remove("sel"));if(e.target.tagName==="IMG"){e.target.classList.add("sel");ED.img=e.target;isz.disabled=false;isz.value=e.target.style.width||""}else{ED.img=null;isz.disabled=true;isz.value=""}};
isz.onchange=()=>{if(ED.img&&isz.value){ED.img.style.width=isz.value;chg()}};
ed.onpaste=e=>{const cd=e.clipboardData||window.clipboardData;const imgs=[...(cd.files||[])].filter(x=>x.type.startsWith("image/"));e.preventDefault();if(imgs.length){keepSel();addImgs(imgs);return}document.execCommand("insertText",false,cd.getData("text/plain"))};
ed.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();ED.flush()}};
$("#tb").onmousedown=e=>{if(e.target.closest("button"))e.preventDefault()};
$("#tb").onclick=e=>{if(e.target.closest("[data-img]")){keepSel();fi.click();return}const b=e.target.closest("[data-cmd]");if(!b)return;ed.focus();document.execCommand(b.dataset.cmd);chg()};
$("#blk").onchange=e=>{ed.focus();document.execCommand("formatBlock",false,"<"+e.target.value+">");e.target.value="p";chg()}}

${L.length?`<div class="grid">${L.map(a=>`<div class="dcard" data-go="audits:${a.id}"><div class="row" style="margin:0;flex-wrap:nowrap"><div class="dico">${ICO.search}</div><div style="min-width:0"><div class="dt">${esc(a.title)}</div><div class="mu" style="font-size:12px">${esc(cn(a.citizen_id))} · ${esc(a.type)}</div></div></div><div class="ex">${esc(plain(a.html).slice(0,160))||"Document vide"}</div><div class="ft">${tag(a.status)}<span>${fd(a.updated_at||a.created_at)}</span></div></div>`).join("")}</div>`:'<div class="card empty">Aucun contrôle.</div>'}`};

/* documents */
function docDetail(id){const d=D.docs.find(x=>x.id===id);if(!d){R.id=null;return V.docs()}
const meta=`<label>Dossier<input list="dcats2" data-meta="docs:${id}:category" value="${esc(d.category||"")}"></label><datalist id="dcats2">${catsAll().map(x=>`<option value="${esc(x)}">`).join("")}</datalist><label>Statut<select data-meta="docs:${id}:status">${["Brouillon","Publié"].map(x=>`<option ${x===d.status?"selected":""}>${x}</option>`).join("")}</select></label><label>Créé par<input value="${esc(d.created_by||"—")}" disabled></label><label>Créé le<input value="${fd(d.created_at)}" disabled></label><button type="button" class="btn g s" data-a="savetpl" data-t="docs" data-id="${id}">★ Enregistrer comme modèle</button>`;
return editorUI("docs",d,"docs",meta)}
V.docs=()=>{if(R.id)return docDetail(R.id);const c=flt.dc||"all";
const L=D.docs.filter(d=>(c==="all"||d.category===c)&&m(d.title+" "+plain(d.html))).sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)));
const cnt=k=>D.docs.filter(d=>k==="all"||d.category===k).length;
return `<div class="lib"><aside class="card cats"><button class="${c==="all"?"on":""}" data-a="flt" data-k="dc" data-v="all">${ICO.library} Tous <span>${cnt("all")}</span></button>${catsAll().map(k=>`<button class="${c===k?"on":""}" data-a="flt" data-k="dc" data-v="${esc(k)}">${CICON[k]||ICO.doc} ${esc(k)} <span>${cnt(k)}</span></button>`).join("")}</aside>
<div><div class="card"><h2>Nouveau document</h2><form data-f="docs">${f("title","Titre","text",true)}<label>Dossier<input name="category" list="dcats" value="${esc(c==="all"?"Général":c)}" placeholder="Choisis ou crée un dossier" required></label><datalist id="dcats">${catsAll().map(x=>`<option value="${esc(x)}">`).join("")}</datalist>${sel("tpl","Modèle",[["blank","Document vierge"],["procedure","Procédure"],["meeting","Compte rendu de réunion"],["bareme","Barème"],...dtplOpts("docs")],"blank")}<button class="btn">Créer et ouvrir</button></form></div>
${tplPanel("docs")}<div class="bar"><h2 style="margin:0">${c==="all"?"Tous les documents":esc(c)} (${L.length})</h2>${sbox("Rechercher dans les documents…")}</div>
${L.length?`<div class="grid">${L.map(d=>`<div class="dcard" data-go="docs:${d.id}"><div class="row" style="margin:0;flex-wrap:nowrap"><div class="dico">${CICON[d.category]||ICO.doc}</div><div style="min-width:0"><div class="dt">${esc(d.title)}</div><div class="mu" style="font-size:12px">${esc(d.category)}</div></div></div><div class="ex">${esc(plain(d.html).slice(0,160))||"Document vide"}</div><div class="ft">${tag(d.status)}<span>${esc(d.updated_by||"")} · ${fd(d.updated_at)}</span></div></div>`).join("")}</div>`:'<div class="card empty">Aucun document.</div>'}</div></div>`};

/* modèles de documents (docs + réunions) */
const docHtml=(k,title)=>{if(String(k).startsWith("t:")){const t=D.doc_templates.find(x=>"t:"+x.id===k);return fillTpl(t?t.html:"",{date:today(),agent:name(),titre:title})}return TPL[k]()};
const dtplOpts=sc=>D.doc_templates.filter(t=>t.scope===sc).sort((a,b)=>a.name.localeCompare(b.name)).map(t=>["t:"+t.id,"★ "+t.name]);
function tplPanel(sc){const L=D.doc_templates.filter(t=>t.scope===sc).sort((a,b)=>a.name.localeCompare(b.name));
return `<details class="card"><summary>Modèles personnalisés (${L.length})</summary><div style="margin-top:12px">${L.length?`<div class="grid">${L.map(t=>`<div class="dcard" data-go="dtpl:${t.id}"><div class="row" style="margin:0;flex-wrap:nowrap"><div class="dico">${ICO.tpl}</div><div style="min-width:0"><div class="dt">${esc(t.name)}</div><div class="mu" style="font-size:12px">Modèle</div></div></div><div class="ex">${esc(plain(t.html).slice(0,120))||"Modèle vide"}</div></div>`).join("")}</div>`:'<p class="mu">Aucun modèle pour l’instant.</p>'}
<form data-f="dtplnew" class="pform" style="margin-top:12px"><input type="hidden" name="scope" value="${sc}"><input name="name" placeholder="Nom du nouveau modèle" required><button class="btn s">Créer le modèle</button></form>
<p class="mu" style="font-size:12px;margin:8px 0 0">Astuce : dans un document ouvert, « Enregistrer comme modèle » en fait un modèle réutilisable. Variables : {{date}}, {{agent}}, {{titre}}.</p></div></details>`}
V.dtpl=()=>{const t=D.doc_templates.find(x=>x.id===R.id);if(!t||(t.scope==="meetings"&&!canTeam())){const sc=t?t.scope:"docs";R.tab=sc;R.id=null;return V[sc]()}
const n=t.scope==="docs"?"Documents":"Réunions";
const meta=`<label>Variables disponibles<input disabled value="{{date}}  {{agent}}  {{titre}}"></label><label>Utilisable dans<input disabled value="${n}"></label><label>Modifié par<input disabled value="${esc(t.updated_by||"—")}"></label>`;
return editorUI("doc_templates",t,t.scope,meta,"name","Supprimer le modèle")};
/* règlement : documents lus par tous, écrits par le directeur */
function ruleDetail(id){const r=D.reglement.find(x=>x.id===id);if(!r){R.id=null;return V.rules()}
if(isDir()){const meta=`<label>Catégorie<input list="rcats" data-meta="reglement:${id}:category" value="${esc(r.category||"")}" placeholder="Ex. Fiscalité"></label><label>Dernière modification par<input value="${esc(r.updated_by||r.created_by||"—")}" disabled></label>`;
return editorUI("reglement",r,"rules",meta)+`<datalist id="rcats">${[...new Set(D.reglement.map(x=>x.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist>`}
return `<div class="row"><button class="btn g s" data-go="rules">${ICO.chL} Retour</button><span style="flex:1"></span><span class="tag">Lecture seule</span><button class="btn g s" data-a="print">${ICO.print} Imprimer</button></div>
<div class="card"><h2 style="margin:0 0 6px">${esc(r.title)}</h2><div class="mu">${esc(r.category||"Sans catégorie")}</div></div>
<div class="paperbg"><div class="paper"><div class="ed">${clean(r.html)}</div></div></div>
<div class="foot mu"><span></span><span>Mis à jour par ${esc(r.updated_by||r.created_by||"—")} · ${fmt(r.updated_at||r.created_at)}</span></div>`}
V.rules=()=>{if(R.id)return ruleDetail(R.id);const w=isDir(),fc=flt.rc||"all";
const cats=[...new Set(D.reglement.map(r=>r.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
const L=D.reglement.filter(r=>(fc==="all"||r.category===fc)&&m(r.title+" "+(r.category||"")+" "+plain(r.html))).sort((a,b)=>String(a.category||"zzz").localeCompare(String(b.category||"zzz"))||String(a.title).localeCompare(String(b.title)));
return `${w?`<div class="card"><h2>Nouveau document du règlement</h2><form data-f="rules">${f("title","Titre (ex. Règlement fiscal)","text",true)}<label>Catégorie<input name="category" list="rcats" placeholder="Ex. Fiscalité"></label><datalist id="rcats">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist><button class="btn">Créer et ouvrir</button></form></div>`:`<div class="card"><span class="mu">Tu peux consulter le règlement. Seul le directeur peut le rédiger ou le modifier.</span></div>`}
<div class="bar"><h2 style="margin:0">Règlement (${D.reglement.length})</h2>${sbox("Rechercher dans le règlement…")}</div>
${cats.length?`<div class="bar">${chips("rc",[["all","Tout"],...cats.map(c=>[c,esc(c)])],fc)}</div>`:""}
${L.length?`<div class="grid">${L.map(r=>`<div class="dcard" data-go="rules:${r.id}"><div class="row" style="margin:0;flex-wrap:nowrap"><div class="dico">${IC.rules}</div><div style="min-width:0"><div class="dt">${esc(r.title)}</div><div class="mu" style="font-size:12px">${esc(r.category||"Sans catégorie")}</div></div></div><div class="ex">${esc(plain(r.html).slice(0,170))||"Document vide"}</div><div class="ft"><span>${esc(r.updated_by||"")}</span><span>${fd(r.updated_at||r.created_at)}</span></div></div>`).join("")}</div>`:`<div class="card empty">Aucun document dans le règlement.${w?" Crée le premier ci-dessus.":""}</div>`}`};

/* impôts des entreprises */
const taxDue=t=>Math.round(Number(t.revenue||0)*Number(t.rate||0))/100;
const taxState=t=>{const due=taxDue(t),p=Number(t.paid||0);if(due>0&&p>=due)return"Payé";if(t.due_date&&t.due_date<iso(new Date()))return"En retard";return p>0?"Partiel":"À payer"};
const taxTag=st=>`<span class="tag ${{"Payé":"g","En retard":"r","Partiel":"o"}[st]||""}">${st}</span>`;
const wkOf=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=t.getUTCFullYear(),w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return y+"-W"+String(w).padStart(2,"0")};
const wkMon=p=>{const m=/^(\d{4})-W(\d{2})$/.exec(p||"");if(!m)return null;const j=new Date(+m[1],0,4);j.setDate(j.getDate()-((j.getDay()+6)%7)+(+m[2]-1)*7);return j};
const periodLabel=p=>{const d=wkMon(p);if(d){const e=new Date(d);e.setDate(e.getDate()+6);const o={day:"numeric",month:"short"};return `Semaine ${+p.slice(-2)} · ${d.toLocaleDateString("fr-FR",o)} – ${e.toLocaleDateString("fr-FR",{...o,year:"numeric"})}`}
if(/^\d{4}-\d{2}$/.test(p||"")){const[y,mm]=p.split("-");return new Date(+y,+mm-1,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}return p||"—"};
const periodShort=p=>/^\d{4}-W\d{2}$/.test(p||"")?"S"+p.slice(-2)+" · "+p.slice(0,4):p||"—";
function taxDetail(id){const t=D.taxes.find(x=>x.id===id);if(!t){R.id=null;return V.taxes()}
const due=taxDue(t),st=taxState(t),pd=Number(t.paid||0),left=Math.max(0,due-pd),co=D.citizens.find(x=>x.id===t.citizen_id)||{};
const ref="IRS-"+String(t.period||"").replace("-","")+"-"+String(t.id).slice(0,4).toUpperCase();
return `<div class="row"><button class="btn g s" data-go="taxes">${ICO.chL} Retour</button><span style="flex:1"></span><button class="btn g s" data-a="print">${ICO.print} Imprimer</button><button class="btn g s" data-a="expdoc" data-fmt="pdf" data-sel=".taxdoc" data-name="avis-${esc(ref)}">⬇ PDF</button><button class="btn g s" data-a="expdoc" data-fmt="png" data-sel=".taxdoc" data-name="avis-${esc(ref)}">⬇ PNG</button><button class="btn g s" data-a="fiche" data-cid="${t.citizen_id}" data-p="${esc(t.period)}">Fiche de prélèvement</button>${st!=="Payé"?`<button class="btn s" data-a="taxpaid" data-id="${id}">Marquer comme payé</button>`:""}</div>
